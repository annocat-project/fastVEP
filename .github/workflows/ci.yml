name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all targets
        run: cargo check --workspace --all-targets
      - name: Run workspace tests
        run: cargo test --workspace
